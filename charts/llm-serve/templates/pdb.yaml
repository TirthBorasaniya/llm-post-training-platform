{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "llm-serve.fullname" . }}
  labels:
    {{- include "llm-serve.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "llm-serve.selectorLabels" . | nindent 6 }}
{{- end }}
