# Default values for the llm-serve chart.
# The model location has no default. Set model.repo, model.file, and model.sha256
# (llamacpp) or model.repo / model.path (sglang) on the command line or in an override file.

# Serving backend: "llamacpp" (CPU) or "sglang" (GPU)
backend: llamacpp

nameOverride: ""
fullnameOverride: ""

# Container images, pinned by explicit tag
images:
  pullPolicy: IfNotPresent
  llamacpp:
    repository: ghcr.io/ggml-org/llama.cpp
    tag: server-b12110
  sglang:
    repository: lmsysorg/sglang
    tag: v0.5.23
  init:
    repository: curlimages/curl
    tag: 8.14.1

imagePullSecrets: []

# Replica count used when autoscaling is disabled
replicaCount: 1

model:
  # Hub repository id, for example "<owner>/<name>"
  repo: ""
  # Git revision of the repository (branch, tag, or commit)
  revision: main
  # Single GGUF file inside the repository (llamacpp only)
  file: ""
  # Expected SHA-256 of the GGUF file, 64 hexadecimal characters (llamacpp only)
  sha256: ""
  # Render without checksum verification. Required for sglang, which downloads
  # the repository snapshot through its own Hub client.
  allowUnverified: false
  # Existing path inside the container or on the mounted volume (sglang only).
  # When set, it is used instead of model.repo and nothing is downloaded.
  path: ""
  # Hub endpoint used by the download init container
  endpoint: https://huggingface.co
  # Name of an existing Secret holding a Hub access token (optional)
  tokenSecret: ""
  tokenSecretKey: token  # pragma: allowlist secret
  persistence:
    enabled: false
    existingClaim: ""
    size: 20Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce

llamacpp:
  port: 8080
  parallel: 2
  contextSize: 4096
  # Additional llama-server arguments, one list item per token
  extraArgs: []

sglang:
  port: 30000
  # Additional launch_server arguments, one list item per token,
  # for example ["--quantization", "fp8"]
  extraArgs: []
  # Size limit of the in-memory /dev/shm volume
  shmSize: 8Gi

extraEnv: []

service:
  type: ClusterIP
  port: 80
  metricsPort: 9100

# The sglang backend always receives an nvidia.com/gpu limit of 1 unless set here
resources: {}

# Runtime class of the pod, for example "nvidia" on clusters where the NVIDIA
# runtime is not the default container runtime
runtimeClassName: ""

podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

probes:
  startup:
    periodSeconds: 10
    # Allows up to periodSeconds * failureThreshold seconds for download and model load
    failureThreshold: 180
    timeoutSeconds: 5
  readiness:
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
  liveness:
    periodSeconds: 20
    failureThreshold: 6
    timeoutSeconds: 5

pdb:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  cooldownPeriod: 120
  pollingInterval: 15
  threshold: 2
  # Prometheus query override. Empty selects the queue metric of the backend.
  query: ""
  prometheus:
    serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090

serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  # Value of the "release" label matched by the Prometheus serviceMonitorSelector
  release: kube-prometheus-stack
  labels: {}
