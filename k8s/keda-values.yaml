# KEDA values with a small footprint for a local cluster.

resources:
  operator:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  metricServer:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  webhooks:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
