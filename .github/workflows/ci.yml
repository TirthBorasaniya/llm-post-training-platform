name: ci

# Manual until the workflow has passed once; then add push and pull_request triggers here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.13.7"
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --frozen --extra ml
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest
      - name: Results tables match the results files
        run: uv run python scripts/render_results.py --check

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install kubeconform
        run: |
          curl -fsSL -o kubeconform.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          mkdir -p .cache/bin
          tar -xzf kubeconform.tgz -C .cache/bin kubeconform
      - name: Lint, render, and validate the chart
        run: scripts/validate_chart.sh
